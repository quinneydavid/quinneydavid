name: Profile widgets
on:
  schedule:
    - cron: "17 0 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml", ".github/scripts/**"]

permissions:
  contents: write

jobs:
  images:
    # Top-languages card and 30-day graph, drawn here and published to the 'output' branch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw language card + activity graph
        run: python3 .github/scripts/profile_cards.py dist
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jamesgeorge007/github-activity-readme@master
        with:
          COMMIT_MSG: "Update recent activity"
          MAX_LINES: 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
